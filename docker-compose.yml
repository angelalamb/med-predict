# ---------------------------------------------------------------------------
# MedPredict — local development stack
#
# Starts Neo4j, the FastAPI backend, and the Streamlit frontend together.
# Secrets come from .env (see .env.example). Neo4j credentials for the
# containers are overridden below so they use the Docker service name
# rather than localhost.
#
# Usage:
#   docker compose up            # start everything
#   docker compose up neo4j      # start only Neo4j (run Python apps natively)
#   docker compose down -v       # stop and remove volumes
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # Neo4j — graph database (local dev only; production uses AuraDB)
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5
    container_name: medpredict-neo4j
    ports:
      - "7474:7474"   # Browser UI  → http://localhost:7474
      - "7687:7687"   # Bolt driver → bolt://localhost:7687
    environment:
      NEO4J_AUTH: neo4j/medpredict-local
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # API — FastAPI backend
  # --------------------------------------------------------------------------
  api:
    build: .
    container_name: medpredict-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override .env so containers reach Neo4j via the Docker service name
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: medpredict-local
      ENVIRONMENT: development
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------------------------------
  # Streamlit app — frontend
  # --------------------------------------------------------------------------
  app:
    build: .
    container_name: medpredict-app
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: medpredict-local
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  neo4j_data:
  neo4j_logs:
