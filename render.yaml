# ---------------------------------------------------------------------------
# MedPredict — Render infrastructure as code
#
# Two web services, both built from the same Dockerfile:
#   medpredict-api  — FastAPI backend
#   medpredict-app  — Streamlit frontend
#
# Render injects PORT automatically — do not override it here.
# Set the secret env vars (sync: false) in the Render dashboard under
# each service → Environment before deploying.
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # FastAPI backend
  # --------------------------------------------------------------------------
  - type: web
    name: medpredict-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 api/main.py
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODEL
        value: claude-sonnet-4-20250514
      # --- Secrets: set these in the Render dashboard, never commit values ---
      - key: NEO4J_URI
        sync: false 
      - key: NEO4J_USERNAME
        sync: false   # neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        sync: false  

  # --------------------------------------------------------------------------
  # Streamlit frontend
  # --------------------------------------------------------------------------
  - type: web
    name: medpredict-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: >-
      streamlit run app/streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: LLM_MODEL
        value: claude-sonnet-4-20250514
      # --- Secrets: same AuraDB + Anthropic credentials as the API ---
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
